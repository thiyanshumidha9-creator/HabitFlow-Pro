<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow Pro</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="A professional, offline-first habit tracker built to help you build better routines and achieve your goals.">
  <meta name="theme-color" content="#ffffff">
  
  <!-- PWA Support -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons Global Library CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js v4 — lightweight charting library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./styles/main.css">
  
  <!-- Automatic cache invalidator for version updates -->
  <script>
    const CURRENT_VERSION = 'v10';
    if (localStorage.getItem('habitflow_app_version') !== CURRENT_VERSION) {
      localStorage.setItem('habitflow_app_version', CURRENT_VERSION);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(keys => {
          Promise.all(keys.map(k => caches.delete(k))).then(() => {
            window.location.reload();
          });
        });
      } else {
        window.location.reload();
      }
    }
  </script>
</head>
<body>
  
  <!-- Application Shell Root -->
  <div id="app"></div>
  
  <!-- App Entry Point -->
  <script type="module" src="./app.js"></script>
  
</body>
</html>
