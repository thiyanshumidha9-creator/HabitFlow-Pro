[project]
name = "habitflow-pro-backend"
version = "1.0.0"
description = "HabitFlow Pro – Offline-First Habit Tracker Backend API"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "HabitFlow Team" }]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

dependencies = [
    # ── Web Framework ──────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # ── Database ───────────────────────────────────────────────
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",

    # ── Authentication & Security ──────────────────────────────
    "pyjwt[crypto]>=2.9.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",

    # ── Validation & Serialization ─────────────────────────────
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # ── Utilities ──────────────────────────────────────────────
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "coverage>=7.6.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
